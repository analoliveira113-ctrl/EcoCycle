name: Construir APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar dependências
        run: npm install

      - name: Gerar ícones e splash Android
        run: npx capacitor-assets generate --android

      - name: Compilar React
        run: npm run build

      - name: Criar projeto Android nativo
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK Debug
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
